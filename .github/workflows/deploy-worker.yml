name: Deploy Cloudflare Worker (optional)

# Only runs when you have added Cloudflare credentials. If the secrets are
# absent the job skips cleanly, so the repository still builds and deploys to
# GitHub Pages without a Cloudflare account.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – token with "Edit Cloudflare Workers" + D1 edit
#   CLOUDFLARE_ACCOUNT_ID  – from the Cloudflare dashboard URL
#
# One-time manual steps before the first run:
#   npx wrangler d1 create nla-lotto        → paste database_id into wrangler.toml
#   npx wrangler d1 execute nla-lotto --remote --file=./schema.sql
#   npx wrangler secret put ADMIN_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and wrangler deploy
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable this workflow. GitHub Pages still deploys."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install, build, deploy
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx wrangler deploy
